<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <script src="{{ '/assets/jquery.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/bootstrap.min.js' | relative_url }}"></script>
    <link rel="stylesheet" href="{{ '/assets/bootstrap.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link type="application/atom+xml" rel="alternate" href="{{ '/feed.xml' | absolute_url }}" title="{{ site.title }}" />
    <link rel="icon" href="{{ '/favicon.png' | relative_url }}" type="image/png">
  </head>
  <body>
    <main class="main{% if page.layout == 'comic' %} comic-page{% endif %}">
      <nav>
        <p>
        <b>
        <a href="{{ '/' | relative_url }}">Home</a> | <a href="{{ '/log' | relative_url }}">Log</a> | <a href="{{ '/about' | relative_url }}">About</a>
        | <a href="{{ '/credits' | relative_url }}">Credits</a>
        </b>
        </p>
      </nav>
      {{ content }}
      <footer>
        Super Benji Adventures is &copy 2026 Themadpunter and Triangle5820. All rights reserved. | <a href="{{ '/contact' | relative_url }}">Contact</a>
      </footer>
    </main>
  </body>
</html>
