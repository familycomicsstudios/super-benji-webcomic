---
layout: default
---
<div class="comic-main">
<img src="{{ page.image }}" width="800px" alt="{{ page.title }}">
{{ content }}
<div class="comic-navigation">
    <p>
    {% if page.number > 1 %}
        <a id="first-page" href="/1">« First</a> |
        <a id="previous-page" href="/{{ page.number | minus: 1 }}">← Previous</a>
    {% endif %}
    {% if page.number > 1 and page.number < site.data.comic.final_page %}
        |
    {% endif %}
    {% if page.number < site.data.comic.final_page %}
        <a id="next-page" href="/{{ page.number | plus: 1 }}">Next →</a> |
        <a id="last-page" href="/{{ site.data.comic.final_page }}">Last »</a>
    {% endif %}
    </p>
</div>
</div>

<script>
document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowLeft") {
        const previous = document.getElementById("previous-page");
        if (previous) {
            window.location.href = previous.href;
        }
    }

    if (event.key === "ArrowRight") {
        const next = document.getElementById("next-page");
        if (next) {
            window.location.href = next.href;
        }
    }
});
</script>
